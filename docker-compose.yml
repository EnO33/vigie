services:
  factory:
    image: vigie-agent:dev
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    # Facultatif : build et gates fonctionnent sans .env ; l'entrypoint exige ses variables au démarrage.
    env_file:
      - path: .env
        required: false
    environment:
      # GateGuard d'ECC bloque la première édition et la première commande Bash de chaque
      # session tant que l'agent n'a pas « présenté des faits ». La règle n°1 de CLAUDE.md
      # (vérifier à la source avant de conclure) couvre déjà ce besoin : on désactive ce seul
      # hook. Interrupteur documenté dans hooks/README.md d'ECC au SHA épinglé c05b2d6 ;
      # il ne touche ni le dispatcher Bash ni la protection de configuration d'ECC.
      ECC_GATEGUARD: "off"
    volumes:
      - workspace:/workspace
      - cargo-registry:/usr/local/cargo/registry
    restart: unless-stopped
    # Les vidages de crash passent par un pipe vers wsl-capture-crash (core_pattern de
    # WSL2) : le noyau ignore RLIMIT_CORE=0 pour un pipe, seule la valeur 1 coupe le
    # vidage. Sans ça, chaque abort d'un processus du conteneur écrit un .dmp sur C:
    # (testé le 2026-11-27 : défaut et core=0 → vidage, core=1 → aucun).
    ulimits:
      core: 1

volumes:
  workspace:
  cargo-registry:
