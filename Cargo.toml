[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# Versions obtenues via `cargo info <crate>`, jamais de mémoire (docs/engineering/FRESHNESS.md).
[workspace.dependencies]
thiserror = "2.0.21"
url = "2.5.9"
cargo_metadata = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"

# ---------------------------------------------------------------------------
# Politique de qualité : PROTÉGÉE (board uniquement). Équivalent de `strict: true`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
deprecated = "deny"
non_ascii_idents = "deny"
unused_qualifications = "deny"
let_underscore_drop = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# le workspace ne publie rien : métadonnées crates.io inutiles
cargo_common_metadata = "allow"
multiple_crate_versions = "warn"

# « pas d'exception non gérée »
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
fallible_impl_from = "deny"
get_unwrap = "deny"
exit = "deny"
mem_forget = "deny"

# « pas de any / unknown »
as_conversions = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"

# « pas de @ts-ignore »
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# exhaustivité et résultats ignorés
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"

# hygiène
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
clone_on_ref_ptr = "deny"
rc_mutex = "deny"
same_name_method = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
